server {
  listen 80;
  root /usr/share/nginx/html;

  # WebLLM makes the app ~12 MB of JavaScript (the main-thread client and the engine worker); gzip cuts it to a third.
  # The model weights and wasm are not served from here: the browser downloads them from Hugging Face and GitHub.
  gzip on;
  gzip_types application/javascript text/css application/json image/svg+xml;
  gzip_min_length 1024;

  # A stopped API container never answers the connection: nginx's default 60 s wait left "Logging in…" spinning for a
  # minute (QA-7-1). Connecting inside the compose network takes milliseconds, so 5 s already means "down" and the
  # browser gets the 504 that the client shows as "server not available".
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
  }
  location / { try_files $uri /index.html; }
}
